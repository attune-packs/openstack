ref: openstack.image_list
label: "List Images"
description: "List private or shared images with a bounded output"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: openstack_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  profile_key: {type: string, default: openstack.profile, required: true}
  cloud: {type: string, required: true}
  region: {type: string, required: true}
  interface: {type: string, enum: [public, internal, admin], required: true}
  project_id: {type: string, required: true}
  visibility: {type: string, enum: [private, shared], default: private}
  max_items: {type: integer, minimum: 1, maximum: 1000, default: 100}
  connect_timeout: {type: integer, minimum: 1, maximum: 30, default: 10}
  read_timeout: {type: integer, minimum: 1, maximum: 300, default: 60}
output: {operation: {type: string}, data: {type: any}, scope: {type: object}}
tags: [openstack, image, read]
