ref: openstack.identity_current
label: "Current Identity and Project"
description: "Verify and return the authenticated user and explicitly selected project scope"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: openstack_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  profile_key: {type: string, default: pack.openstack.profile, required: true, description: "Pack-owned encrypted OpenStack profile Key ref"}
  cloud: {type: string, required: true, description: "Expected named cloud in the profile"}
  region: {type: string, required: true, description: "Expected profile region_name"}
  interface: {type: string, enum: [public, internal, admin], required: true, description: "Expected endpoint interface"}
  project_id: {type: string, required: true, description: "Expected authenticated project ID"}
  connect_timeout: {type: integer, minimum: 1, maximum: 30, default: 10}
  read_timeout: {type: integer, minimum: 1, maximum: 300, default: 60}
output: &output
  operation: {type: string}
  data: {type: any}
  scope: {type: object}
tags: [openstack, identity, read]
