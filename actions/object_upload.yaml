ref: openstack.object_upload
label: "Upload Object Artifact"
description: "Upload one confined worker artifact to an explicitly confirmed Swift object key"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: openstack_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  profile_key: {type: string, default: pack.openstack.profile, required: true}
  cloud: {type: string, required: true}
  region: {type: string, required: true}
  interface: {type: string, enum: [public, internal, admin], required: true}
  project_id: {type: string, required: true}
  container: {type: string, required: true}
  object_name: {type: string, required: true}
  artifact_path: {type: string, required: true, description: "Relative path beneath profile artifact_root"}
  max_bytes: {type: integer, minimum: 1, description: "Must not exceed profile max_artifact_bytes"}
  confirm: {type: string, required: true, description: "Must equal UPLOAD:<container>/<object_name>; acknowledges overwrite semantics"}
  connect_timeout: {type: integer, minimum: 1, maximum: 30, default: 10}
  read_timeout: {type: integer, minimum: 1, maximum: 300, default: 300}
output: {operation: {type: string}, data: {type: any}, scope: {type: object}}
tags: [openstack, object-store, artifact, mutate]
