ref: openstack.object_download
label: "Download Object Artifact"
description: "Atomically download a bounded Swift object beneath the profile artifact root"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: openstack_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  profile_key: {type: string, default: openstack.profile, required: true}
  cloud: {type: string, required: true}
  region: {type: string, required: true}
  interface: {type: string, enum: [public, internal, admin], required: true}
  project_id: {type: string, required: true}
  container: {type: string, required: true}
  object_name: {type: string, required: true}
  artifact_path: {type: string, required: true, description: "Relative destination beneath profile artifact_root; parent must exist"}
  max_bytes: {type: integer, minimum: 1, description: "Must not exceed profile max_artifact_bytes"}
  confirm: {type: string, description: "When target exists, must equal OVERWRITE:<artifact_path>"}
  connect_timeout: {type: integer, minimum: 1, maximum: 30, default: 10}
  read_timeout: {type: integer, minimum: 1, maximum: 300, default: 300}
output: {operation: {type: string}, data: {type: any}, scope: {type: object}}
tags: [openstack, object-store, artifact, read]
